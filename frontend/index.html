<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Board</title>
  <style>
    /* ---- Base ------------------------------------------------------ */
    :root {
      --accent: #ffab31;
      --ink: #1a1a1a;
      --muted: #565350;
      --line: #e6e1dc;
      --col-bg: #f5f2ef;
      --card-bg: #ffffff;
      --high: #e0574a;
      --medium: #d9902a;
      --low: #5a9e6f;
    }
    * { box-sizing: border-box; }
    /* The hidden attribute must win over the display rules below. */
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #fdfcfa 0%, #f3ede6 100%);
    }
    header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
      border-top: 4px solid var(--accent);
    }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    /* ---- Banners (loading / error) --------------------------------- */
    .banner {
      margin: 16px 28px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      background: #f0ede9;
      color: var(--muted);
    }
    .banner.error {
      background: #fdecea;
      color: #a3271b;
      border: 1px solid #f3c6c0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .banner.error button {
      margin-left: auto;
      border: 1px solid #a3271b;
      background: #fff;
      color: #a3271b;
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    /* ---- Board ----------------------------------------------------- */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 20px 28px 40px;
      align-items: start;
    }
    @media (max-width: 720px) {
      .board { grid-template-columns: 1fr; }
    }
    .column {
      background: var(--col-bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      min-height: 120px;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .column.drag-over {
      background: #efe7d8;
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    .col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .col-title { font-weight: 700; font-size: 14px; }
    .count {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      min-width: 22px;
      text-align: center;
      border-radius: 20px;
      padding: 1px 8px;
    }
    .cards { display: flex; flex-direction: column; gap: 10px; min-height: 24px; }
    .empty {
      margin: 6px 4px;
      color: #a49f99;
      font-size: 13px;
      font-style: italic;
    }

    /* ---- Card ------------------------------------------------------ */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      cursor: grab;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .card:hover { box-shadow: 0 6px 16px rgba(0,0,0,0.10); transform: translateY(-1px); }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: 0.5; }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card .title { font-weight: 600; font-size: 14px; }
    .card .desc { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
    .card .assignee { margin: 8px 0 0; font-size: 12px; color: #8a857f; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-radius: 20px;
      padding: 2px 9px;
      color: #fff;
      white-space: nowrap;
    }
    .badge.high { background: var(--high); }
    .badge.medium { background: var(--medium); }
    .badge.low { background: var(--low); }

    /* ---- Toast ----------------------------------------------------- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b2926;
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      max-width: 90vw;
    }

    /* ---- Header layout + buttons ----------------------------------- */
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .btn-primary {
      background: linear-gradient(180deg, #ffb84a 0%, #ffab31 100%);
      color: #3a2f14; border: none;
      font-weight: 700; font-size: 14px; border-radius: 8px;
      padding: 9px 16px; cursor: pointer; white-space: nowrap;
      box-shadow: 0 2px 6px rgba(224,150,20,0.30);
    }
    .btn-primary:hover { filter: brightness(0.97); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-secondary {
      background: #fff; color: var(--muted); border: 1px solid var(--line);
      font-size: 14px; border-radius: 8px; padding: 9px 16px; cursor: pointer;
    }
    .edit-btn {
      background: none; border: none; color: #a49f99; font-size: 12px;
      cursor: pointer; padding: 2px 4px; text-decoration: underline; flex: none;
    }
    .edit-btn:hover { color: var(--muted); }

    /* ---- Modal ----------------------------------------------------- */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 60px 16px; z-index: 50;
    }
    .modal {
      background: #fff; border-radius: 12px; width: 100%; max-width: 460px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25); overflow: hidden;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
    }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .icon-btn {
      background: none; border: none; font-size: 22px; line-height: 1;
      color: var(--muted); cursor: pointer;
    }
    #task-form { padding: 18px 20px; }
    #task-form label {
      display: block; font-size: 13px; font-weight: 600;
      margin-bottom: 12px; color: var(--muted);
    }
    #task-form input, #task-form textarea, #task-form select {
      width: 100%; margin-top: 5px; padding: 8px 10px; font: inherit;
      border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
      background: #fff;
    }
    #task-form .row { display: flex; gap: 12px; }
    #task-form .row label { flex: 1; }
    .req { color: var(--high); }
    .field-error { color: #a3271b; font-size: 12.5px; margin: -6px 0 12px; }
    .form-error {
      color: #a3271b; font-size: 12.5px; margin: 4px 0 0;
      padding: 8px 10px; background: #fdecea; border-radius: 6px;
      border: 1px solid #f3c6c0;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

    /* ---- Filter / search bar (mid-course) -------------------------- */
    .filters {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 14px 28px 0;
    }
    .filters input[type="search"] {
      flex: 1; min-width: 200px; padding: 8px 12px; font: inherit;
      border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
    }
    .filters select {
      padding: 8px 10px; font: inherit; background: #fff;
      border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
    }
    .filters .check {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--muted); white-space: nowrap;
    }

    /* ---- Card due date + overdue pill (mid-course) ----------------- */
    .card .meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .card .due { font-size: 12px; color: var(--muted); }
    .pill-overdue {
      font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
      background: #fdecea; color: #a3271b; border: 1px solid #f3c6c0;
      border-radius: 20px; padding: 1px 8px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Task Board</h1>
      <p>Drag a card to move it forward. Backend rules decide whether a move is allowed.</p>
    </div>
    <button id="new-task" class="btn-primary" type="button">+ New Task</button>
  </header>

  <!-- Search + combined filters (mid-course) -->
  <div class="filters">
    <input id="q" type="search" placeholder="Search title or description…" autocomplete="off" />
    <select id="filter-priority" aria-label="Filter by priority">
      <option value="">All priorities</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <label class="check"><input id="filter-overdue" type="checkbox" /> Overdue only</label>
    <button id="clear-filters" class="btn-secondary" type="button">Clear</button>
  </div>

  <!-- UI states -->
  <div id="loading" class="banner">Loading tasks&hellip;</div>
  <div id="error" class="banner error" hidden>
    <span>Could not reach the API. Is the backend running on <code>localhost:8000</code>?</span>
    <button id="retry" type="button">Retry</button>
  </div>

  <!-- Board (three fixed columns matching the API statuses) -->
  <main id="board" class="board" hidden>
    <section class="column" data-status="ToDo">
      <div class="col-head"><span class="col-title">To Do</span><span class="count">0</span></div>
      <div class="cards"></div>
    </section>
    <section class="column" data-status="InProgress">
      <div class="col-head"><span class="col-title">In Progress</span><span class="count">0</span></div>
      <div class="cards"></div>
    </section>
    <section class="column" data-status="Done">
      <div class="col-head"><span class="col-title">Done</span><span class="count">0</span></div>
      <div class="cards"></div>
    </section>
  </main>

  <!-- Create / Edit modal -->
  <div id="overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">New Task</h2>
        <button id="modal-close" class="icon-btn" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="task-form" novalidate>
        <label>Title <span class="req">*</span>
          <input id="f-title" type="text" maxlength="200" autocomplete="off" />
        </label>
        <p id="title-error" class="field-error" hidden></p>
        <label>Description
          <textarea id="f-desc" rows="3"></textarea>
        </label>
        <div class="row">
          <label>Status
            <select id="f-status">
              <option value="ToDo">To Do</option>
              <option value="InProgress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </label>
          <label>Priority
            <select id="f-priority">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Assignee
            <input id="f-assignee" type="text" autocomplete="off" />
          </label>
          <label>Due date
            <input id="f-due" type="date" />
          </label>
        </div>
        <p id="form-error" class="form-error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn-secondary">Cancel</button>
          <button type="submit" id="modal-save" class="btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    // ---- Constants (must match the backend enums exactly) -----------
    const API_BASE = "http://localhost:8000";
    const STATUSES = ["ToDo", "InProgress", "Done"];
    const STATUS_LABELS = { ToDo: "To Do", InProgress: "In Progress", Done: "Done" };
    const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };

    // In-memory copy of what the server returned; the board renders from this.
    let tasks = [];

    // Today as a YYYY-MM-DD string (for the client-side overdue pill).
    function todayISO() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${d.getFullYear()}-${m}-${day}`;
    }

    // A task is overdue if its due date is before today and it is not Done -
    // the same rule the backend uses.
    function isOverdue(task) {
      return Boolean(task.due_date) && task.due_date < todayISO() && task.status !== "Done";
    }

    // ---- Layer 1: data ---------------------------------------------
    // Build the query string from the current filter controls so the backend
    // does the search + combined filtering.
    function currentQuery() {
      const params = new URLSearchParams();
      const q = document.getElementById("q").value.trim();
      const priority = document.getElementById("filter-priority").value;
      const overdue = document.getElementById("filter-overdue").checked;
      if (q) params.set("search", q);
      if (priority) params.set("priority", priority);
      if (overdue) params.set("overdue", "true");
      return params.toString();
    }

    async function fetchTasks() {
      const qs = currentQuery();
      const res = await fetch(`${API_BASE}/tasks${qs ? "?" + qs : ""}`);
      if (!res.ok) throw new Error(`GET /tasks failed: ${res.status}`);
      return res.json();
    }

    // ---- Layer 2: state machine (loading / ready / error) ----------
    function showState(state) {
      document.getElementById("loading").hidden = state !== "loading";
      document.getElementById("error").hidden = state !== "error";
      document.getElementById("board").hidden = state !== "ready";
    }

    async function load() {
      showState("loading");
      try {
        tasks = await fetchTasks();
        renderBoard();
        showState("ready");
      } catch (err) {
        console.error(err);
        showState("error");
      }
    }

    // ---- Layer 3: rendering ----------------------------------------
    function sortByPriorityThenId(a, b) {
      const pa = PRIORITY_ORDER[a.priority] ?? 99;
      const pb = PRIORITY_ORDER[b.priority] ?? 99;
      if (pa !== pb) return pa - pb;             // High -> Medium -> Low
      return String(a.id).localeCompare(String(b.id)); // predictable tie-break
    }

    function createCard(task) {
      const card = document.createElement("article");
      card.className = "card";
      card.draggable = true;
      card.dataset.id = task.id;

      const top = document.createElement("div");
      top.className = "card-top";
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = task.title;            // textContent = no HTML injection
      const badge = document.createElement("span");
      badge.className = "badge " + String(task.priority).toLowerCase();
      badge.textContent = task.priority;
      const edit = document.createElement("button");
      edit.className = "edit-btn";
      edit.type = "button";
      edit.textContent = "Edit";
      // Open the edit modal; stop the click from starting a drag.
      edit.addEventListener("click", (e) => { e.stopPropagation(); openEdit(task); });
      top.append(title, badge, edit);
      card.append(top);

      if (task.description) {
        const d = document.createElement("p");
        d.className = "desc";
        d.textContent = task.description;
        card.append(d);
      }
      if (task.assignee) {
        const a = document.createElement("p");
        a.className = "assignee";
        a.textContent = "Assignee: " + task.assignee;
        card.append(a);
      }

      // Due date + overdue pill (overdue rule lives in isOverdue()).
      const overdue = isOverdue(task);
      if (task.due_date || overdue) {
        const meta = document.createElement("div");
        meta.className = "meta";
        if (task.due_date) {
          const due = document.createElement("span");
          due.className = "due";
          due.textContent = "Due " + task.due_date;
          meta.append(due);
        }
        if (overdue) {
          const pill = document.createElement("span");
          pill.className = "pill-overdue";
          pill.textContent = "Overdue";
          meta.append(pill);
        }
        card.append(meta);
      }
      return card;
    }

    function renderBoard() {
      for (const status of STATUSES) {
        const column = document.querySelector(`.column[data-status="${status}"]`);
        const list = column.querySelector(".cards");
        const items = tasks.filter(t => t.status === status).sort(sortByPriorityThenId);

        list.innerHTML = "";
        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No tasks";
          list.append(empty);
        } else {
          for (const task of items) list.append(createCard(task));
        }
        column.querySelector(".count").textContent = items.length;
      }
    }

    // ---- Layer 4: drag and drop ------------------------------------
    // Move a task optimistically, then confirm with the API; revert on reject.
    async function moveTask(id, newStatus) {
      const task = tasks.find(t => String(t.id) === String(id));
      if (!task) return;
      if (task.status === newStatus) return;     // dropped in the same column: no PATCH

      const previous = task.status;
      task.status = newStatus;                   // optimistic update
      renderBoard();

      try {
        const res = await fetch(`${API_BASE}/tasks/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus }),
        });
        if (!res.ok) {
          let detail = `HTTP ${res.status}`;
          try { detail = (await res.json()).detail || detail; } catch (_) {}
          throw new Error(detail);
        }
        Object.assign(task, await res.json());   // sync with the server's truth
        renderBoard();
      } catch (err) {
        task.status = previous;                  // revert the optimistic move
        renderBoard();
        showToast(`Move rejected: ${STATUS_LABELS[previous]} → ${STATUS_LABELS[newStatus]} is not allowed`);
      }
    }

    // Delegated dragstart/dragend on the board so handlers survive re-render.
    const board = document.getElementById("board");
    board.addEventListener("dragstart", (e) => {
      const card = e.target.closest(".card");
      if (!card) return;
      e.dataTransfer.setData("text/plain", card.dataset.id);
      e.dataTransfer.effectAllowed = "move";
      card.classList.add("dragging");
    });
    board.addEventListener("dragend", (e) => {
      const card = e.target.closest(".card");
      if (card) card.classList.remove("dragging");
    });

    // Columns are static, so attach their drop handlers once.
    document.querySelectorAll(".column").forEach((col) => {
      col.addEventListener("dragover", (e) => {
        e.preventDefault();                      // REQUIRED so the browser allows a drop
        e.dataTransfer.dropEffect = "move";
        col.classList.add("drag-over");
      });
      col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
      col.addEventListener("drop", (e) => {
        e.preventDefault();
        col.classList.remove("drag-over");
        const id = e.dataTransfer.getData("text/plain");
        const newStatus = col.dataset.status;    // target status from the column, not display text
        moveTask(id, newStatus);
      });
    });

    // ---- Toast ------------------------------------------------------
    let toastTimer;
    function showToast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
    }

    // ---- Layer 5: create / edit modal ------------------------------
    const overlay = document.getElementById("overlay");
    const form = document.getElementById("task-form");
    let editingId = null;   // null = create mode, otherwise the task id

    function clearErrors() {
      const te = document.getElementById("title-error");
      te.hidden = true; te.textContent = "";
      const fe = document.getElementById("form-error");
      fe.hidden = true; fe.textContent = "";
    }

    function openCreate() {
      editingId = null;
      form.reset();
      document.getElementById("modal-title").textContent = "New Task";
      document.getElementById("modal-save").textContent = "Create";
      document.getElementById("f-status").value = "ToDo";
      document.getElementById("f-priority").value = "Medium";
      clearErrors();
      overlay.hidden = false;
      document.getElementById("f-title").focus();
    }

    function openEdit(task) {
      editingId = task.id;
      document.getElementById("modal-title").textContent = "Edit Task";
      document.getElementById("modal-save").textContent = "Save changes";
      document.getElementById("f-title").value = task.title;
      document.getElementById("f-desc").value = task.description || "";
      document.getElementById("f-status").value = task.status;
      document.getElementById("f-priority").value = task.priority;
      document.getElementById("f-assignee").value = task.assignee || "";
      document.getElementById("f-due").value = task.due_date || "";
      clearErrors();
      overlay.hidden = false;
      document.getElementById("f-title").focus();
    }

    function closeModal() {
      overlay.hidden = true;
      editingId = null;
    }

    function showFormError(message) {
      const fe = document.getElementById("form-error");
      fe.textContent = message;
      fe.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      // Front-end validation: block an empty/whitespace title BEFORE any
      // network request, so obvious mistakes never reach the backend.
      const title = document.getElementById("f-title").value.trim();
      if (!title) {
        const te = document.getElementById("title-error");
        te.textContent = "Title is required.";
        te.hidden = false;
        document.getElementById("f-title").focus();
        return;
      }

      const descVal = document.getElementById("f-desc").value.trim();
      const statusVal = document.getElementById("f-status").value;
      const priorityVal = document.getElementById("f-priority").value;
      const assigneeVal = document.getElementById("f-assignee").value.trim();
      const dueVal = document.getElementById("f-due").value;   // "" or YYYY-MM-DD

      let url, method, payload;
      if (editingId === null) {
        method = "POST";
        url = `${API_BASE}/tasks`;
        payload = { title, status: statusVal, priority: priorityVal };
        if (descVal) payload.description = descVal;
        if (assigneeVal) payload.assignee = assigneeVal;
        if (dueVal) payload.due_date = dueVal;
      } else {
        // Edit: send only the fields that actually changed. In particular,
        // do NOT resend an unchanged status (the backend would reject
        // current -> current as an invalid same->same transition).
        const task = tasks.find(t => String(t.id) === String(editingId));
        method = "PATCH";
        url = `${API_BASE}/tasks/${editingId}`;
        payload = {};
        if (title !== task.title) payload.title = title;
        if (descVal !== (task.description || "")) payload.description = descVal;
        if (statusVal !== task.status) payload.status = statusVal;
        if (priorityVal !== task.priority) payload.priority = priorityVal;
        if (assigneeVal !== (task.assignee || "")) payload.assignee = assigneeVal || null;
        if (dueVal !== (task.due_date || "")) payload.due_date = dueVal || null;
        if (Object.keys(payload).length === 0) { closeModal(); return; }
      }

      try {
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          // Keep the modal open and show the server's message (e.g. a 422
          // invalid-transition error) instead of silently closing.
          let message = `Request failed (HTTP ${res.status}).`;
          try {
            const body = await res.json();
            if (typeof body.detail === "string") message = body.detail;
            else if (Array.isArray(body.detail) && body.detail[0]) {
              message = body.detail[0].msg || message;
            }
          } catch (_) {}
          showFormError(message);
          return;
        }
        closeModal();
        await load();   // refresh + resort the board on success
      } catch (err) {
        showFormError("Network error: " + err.message);
      }
    });

    // Open create, and all the dismissal flows.
    document.getElementById("new-task").addEventListener("click", openCreate);
    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-close").addEventListener("click", closeModal);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !overlay.hidden) closeModal();
    });

    // ---- Filter / search controls (mid-course) ---------------------
    // Each control re-fetches from the backend so search + filters combine.
    let searchTimer;
    document.getElementById("q").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(load, 250);   // debounce typing
    });
    document.getElementById("filter-priority").addEventListener("change", load);
    document.getElementById("filter-overdue").addEventListener("change", load);
    document.getElementById("clear-filters").addEventListener("click", () => {
      document.getElementById("q").value = "";
      document.getElementById("filter-priority").value = "";
      document.getElementById("filter-overdue").checked = false;
      load();
    });

    // ---- Init -------------------------------------------------------
    document.getElementById("retry").addEventListener("click", load);
    load();
  </script>
</body>
</html>
